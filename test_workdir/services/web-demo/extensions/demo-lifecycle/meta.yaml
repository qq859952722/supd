name: demo-lifecycle
version: "1.0.0"
description: "web-demo 服务级 service_lifecycle 扩展（pre_start/post_ready/on_failure/pre_stop 全 4 事件）"
enabled: true
runtime: bash
entry: run.sh
timeout_seconds: 30
concurrency: parallel
triggers:
  service_lifecycle:
    - event: pre_start
      action: on_pre_start
    - event: post_ready
      action: on_ready
    - event: on_failure
      action: on_failure
    - event: pre_stop
      action: on_stop
actions:
  - id: on_pre_start
    label: "服务启动前钩子"
    button_style: default
  - id: on_ready
    label: "服务就绪钩子"
    button_style: default
  - id: on_failure
    label: "服务失败钩子"
    button_style: danger
  - id: on_stop
    label: "服务停止钩子"
    button_style: default
