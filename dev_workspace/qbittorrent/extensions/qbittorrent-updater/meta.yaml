name: qbittorrent-updater
version: "1.0.0"
description: "qBittorrent 二进制更新管理：检查 GitHub 最新版本、下载并安装静态二进制"
runtime: tjs
entry: run.js
timeout_seconds: 300
enabled: true

concurrency: serialize

ui:
  show_logs: true
  button_style: primary
  icon: refresh

# 三个 action：仅检查 / 仅安装（通过 INSTALL_TAG 环境变量指定版本） / 检查并安装最新版
# action 区分通过 SUPD_ACTION 环境变量，安装版本通过 env.yaml 的 INSTALL_TAG 指定
actions:
  - id: check-update
    label: 检查更新
    button_style: default
  - id: install
    label: 安装指定版本
    button_style: primary
  - id: install-latest
    label: 检查并安装最新版
    button_style: primary

triggers:
  on_demand: true
