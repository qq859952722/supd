name: 手动构建并推送 Docker 镜像

# 手动触发：在 GitHub Actions 页面点击 "Run workflow"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本标签（如 v0.0.1，留空则使用 latest）"
        required: false
        default: ""
      push:
        description: "推送到 GHCR？"
        required: false
        type: boolean
        default: true
      tjs_version:
        description: "txiki.js 版本（默认 v26.6.0）"
        required: false
        default: "v26.6.0"
      variant:
        description: "镜像变体（alpine / debian / both）"
        required: false
        type: choice
        options:
          - alpine
          - debian
          - both
        default: "alpine"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # tjs 编译流程、补丁或基础镜像变化时递增
  TJS_CACHE_SCHEMA: "v3"
  TJS_CACHE_RELEASE: "tjs-cache"

jobs:
  # ────────────────────────────────────────────────────────────
  # 固定 Release：所有 tjs 版本资产集中存放于 tjs-cache
  # ────────────────────────────────────────────────────────────
  ensure-tjs-cache-release:
    name: "准备 tjs-cache Release"
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 确保固定 Release 存在
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${TJS_CACHE_RELEASE}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TJS_CACHE_RELEASE}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "tjs build cache" \
              --notes "自动维护的 txiki.js 构建缓存，最多保留最近 5 个 TJS_VERSION。" \
              --prerelease
          fi
          # 清理旧流程错误上传的无平台信息资产
          if gh release view "${TJS_CACHE_RELEASE}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fxq tjs; then
            gh release delete-asset "${TJS_CACHE_RELEASE}" tjs --repo "${GITHUB_REPOSITORY}" --yes
          fi

  # ────────────────────────────────────────────────────────────
  # Alpine 变体：在对应平台原生编译 tjs + 构建 Docker 镜像
  # ────────────────────────────────────────────────────────────
  build-alpine:
    name: "[Alpine ${{ matrix.arch }}] 编译 tjs + 构建镜像"
    if: always() && (inputs.variant == 'alpine' || inputs.variant == 'both') && (needs.ensure-tjs-cache-release.result == 'success' || needs.ensure-tjs-cache-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            docker_platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64

    runs-on: ${{ matrix.runner }}
    needs: ensure-tjs-cache-release
    permissions:
      contents: write
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ── 确定版本标签 ──
      - name: 确定版本标签
        id: ver
        run: |
          INPUT="${{ inputs.version }}"
          if [ -z "$INPUT" ]; then
            echo "tag=latest"    >> "$GITHUB_OUTPUT"
            echo "version=dev"   >> "$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT}"  >> "$GITHUB_OUTPUT"
            echo "version=${INPUT}" >> "$GITHUB_OUTPUT"
          fi

      # ── 查找 tjs Actions 缓存 ──
      - name: 查找 tjs 构建缓存
        id: tjs-cache
        uses: actions/cache@v5
        with:
          path: /tmp/tjs-binary
          key: tjs-alpine-${{ env.TJS_CACHE_SCHEMA }}-alpine320-${{ matrix.arch }}-${{ inputs.tjs_version }}

      - name: 从固定 Release 获取 tjs
        id: release-cache
        if: steps.tjs-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: tjs-alpine-${{ matrix.arch }}-${{ inputs.tjs_version }}-${{ env.TJS_CACHE_SCHEMA }}
        run: |
          mkdir -p /tmp/tjs-binary
          if gh release download "${TJS_CACHE_RELEASE}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET}" --dir /tmp/tjs-binary --clobber; then
            mv "/tmp/tjs-binary/${ASSET}" /tmp/tjs-binary/tjs
            echo "hit=true" >> "$GITHUB_OUTPUT"
            chmod +x /tmp/tjs-binary/tjs
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            rm -f /tmp/tjs-binary/tjs
          fi

      # ── 仅在缓存未命中时于 Alpine 容器内编译 ──
      - name: 在 Alpine 容器中编译 txiki.js（确保 musl 兼容）
        if: steps.tjs-cache.outputs.cache-hit != 'true' && steps.release-cache.outputs.hit != 'true'
        run: |
          mkdir -p /tmp/tjs-binary
          docker run --rm \
            -e TJS_VERSION="${{ inputs.tjs_version }}" \
            -v /tmp/tjs-binary:/output \
            alpine:3.20 sh -c '
              set -e
              apk add --no-cache \
                build-base cmake ninja \
                git ca-certificates \
                curl-dev libffi-dev openssl-dev zlib-dev linux-headers
              git clone --recursive --depth 1 --branch "${TJS_VERSION}" \
                https://github.com/saghul/txiki.js.git /tmp/txiki-src
              cd /tmp/txiki-src
              find . -name "*.c" -o -name "*.h" | xargs sed -i "/#pragma region/d; /#pragma endregion/d"
              make
              TJS_BIN="$(find build -name tjs -type f | head -1)"
              "${TJS_BIN}" --version
              cp "${TJS_BIN}" /output/tjs && chmod +x /output/tjs
            '

      - name: 验证 tjs
        run: |
          file /tmp/tjs-binary/tjs
          if file /tmp/tjs-binary/tjs | grep -q "ld-musl"; then
            echo "✅ tjs 是 musl 链接"
          else
            echo "❌ tjs 不是 musl 链接"
            exit 1
          fi

      - name: 上传 tjs 到固定 Release
        if: inputs.push && steps.release-cache.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: tjs-alpine-${{ matrix.arch }}-${{ inputs.tjs_version }}-${{ env.TJS_CACHE_SCHEMA }}
        run: |
          install -m 755 /tmp/tjs-binary/tjs "/tmp/tjs-binary/${ASSET}"
          gh release upload "${TJS_CACHE_RELEASE}" "/tmp/tjs-binary/${ASSET}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view "${TJS_CACHE_RELEASE}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fxq "${ASSET}"

      # ── 把编译好的 tjs 复制到 build context ──
      - name: 准备 tjs 到 build context
        run: cp /tmp/tjs-binary/tjs ./tjs && chmod +x ./tjs

      # ── 构建 Docker 镜像 ──
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Alpine ${{ matrix.arch }} 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: ${{ matrix.docker_platform }}
          push: ${{ inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max

  # ────────────────────────────────────────────────────────────
  # Debian 变体：在 Debian 容器中编译 tjs（glibc 链接）+ 构建镜像
  # ────────────────────────────────────────────────────────────
  cleanup-tjs-cache:
    name: "清理 tjs-cache Release"
    if: always() && inputs.push
    runs-on: ubuntu-latest
    needs: [build-alpine, build-debian]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 按 TJS_VERSION 保留最近 5 个版本
        run: |
          set -euo pipefail
          mapfile -t assets < <(gh release view "${TJS_CACHE_RELEASE}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          versions_file="$(mktemp)"
          trap 'rm -f "${versions_file}"' EXIT
          for asset in "${assets[@]}"; do
            case "${asset}" in
              tjs-alpine-amd64-*) rest="${asset#tjs-alpine-amd64-}" ;;
              tjs-alpine-arm64-*) rest="${asset#tjs-alpine-arm64-}" ;;
              tjs-debian-amd64-*) rest="${asset#tjs-debian-amd64-}" ;;
              tjs-debian-arm64-*) rest="${asset#tjs-debian-arm64-}" ;;
              *) continue ;;
            esac
            version="${rest%-v[0-9]*}"
            [[ "${version}" == v* ]] && echo "${version}" >> "${versions_file}"
          done
          mapfile -t versions < <(sort -Vu "${versions_file}")
          if (( ${#versions[@]} <= 5 )); then exit 0; fi
          mapfile -t keep_versions < <(printf '%s\n' "${versions[@]}" | sort -V | tail -n 5)
          for asset in "${assets[@]}"; do
            case "${asset}" in
              tjs-alpine-amd64-*) rest="${asset#tjs-alpine-amd64-}" ;;
              tjs-alpine-arm64-*) rest="${asset#tjs-alpine-arm64-}" ;;
              tjs-debian-amd64-*) rest="${asset#tjs-debian-amd64-}" ;;
              tjs-debian-arm64-*) rest="${asset#tjs-debian-arm64-}" ;;
              *) continue ;;
            esac
            version="${rest%-v[0-9]*}"
            if [[ "${version}" == v* ]] && ! printf '%s\n' "${keep_versions[@]}" | grep -Fxq "${version}"; then
              gh release delete-asset "${TJS_CACHE_RELEASE}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
            fi
          done

  build-debian:
    name: "[Debian ${{ matrix.arch }}] 编译 tjs + 构建镜像"
    if: always() && (inputs.variant == 'debian' || inputs.variant == 'both') && (needs.ensure-tjs-cache-release.result == 'success' || needs.ensure-tjs-cache-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            docker_platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64

    runs-on: ${{ matrix.runner }}
    needs: ensure-tjs-cache-release
    permissions:
      contents: write
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 确定版本
        id: ver
        run: |
          INPUT="${{ inputs.version }}"
          if [ -z "$INPUT" ]; then
            echo "tag=latest"    >> "$GITHUB_OUTPUT"
            echo "version=dev"   >> "$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT}"  >> "$GITHUB_OUTPUT"
            echo "version=${INPUT}" >> "$GITHUB_OUTPUT"
          fi

      - name: 查找 tjs Actions 缓存（Debian/glibc 编译）
        id: tjs-cache
        uses: actions/cache@v5
        with:
          path: /tmp/tjs-binary
          key: tjs-debian-${{ env.TJS_CACHE_SCHEMA }}-bookworm-${{ matrix.arch }}-${{ inputs.tjs_version }}

      - name: 从固定 Release 获取 tjs
        id: release-cache
        if: steps.tjs-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: tjs-debian-${{ matrix.arch }}-${{ inputs.tjs_version }}-${{ env.TJS_CACHE_SCHEMA }}
        run: |
          mkdir -p /tmp/tjs-binary
          if gh release download "${TJS_CACHE_RELEASE}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET}" --dir /tmp/tjs-binary --clobber; then
            mv "/tmp/tjs-binary/${ASSET}" /tmp/tjs-binary/tjs
            echo "hit=true" >> "$GITHUB_OUTPUT"
            chmod +x /tmp/tjs-binary/tjs
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            rm -f /tmp/tjs-binary/tjs
          fi

      - name: 在 Debian 容器中编译 txiki.js（glibc 兼容）
        if: steps.tjs-cache.outputs.cache-hit != 'true' && steps.release-cache.outputs.hit != 'true'
        run: |
          mkdir -p /tmp/tjs-binary
          docker run --rm \
            -e TJS_VERSION="${{ inputs.tjs_version }}" \
            -v /tmp/tjs-binary:/output \
            debian:bookworm-slim bash -c '
              set -e
              apt-get update && apt-get install --no-install-recommends -y \
                build-essential cmake ninja-build file \
                git ca-certificates \
                libcurl4-openssl-dev libffi-dev libssl-dev zlib1g-dev
              git clone --recursive --depth 1 --branch "${TJS_VERSION}" \
                https://github.com/saghul/txiki.js.git /tmp/txiki-src
              cd /tmp/txiki-src
              find . -name "*.c" -o -name "*.h" | xargs sed -i "/#pragma region/d; /#pragma endregion/d"
              make
              TJS_BIN="$(find build -name tjs -type f | head -1)"
              "${TJS_BIN}" --version
              cp "${TJS_BIN}" /output/tjs && chmod +x /output/tjs
            '

      - name: 验证 tjs
        run: |
          file /tmp/tjs-binary/tjs
          if file /tmp/tjs-binary/tjs | grep -q "ld-linux"; then
            echo "✅ tjs 是 glibc 链接"
          else
            echo "❌ tjs 不是 glibc 链接"
            exit 1
          fi

      - name: 上传 tjs 到固定 Release
        if: inputs.push && steps.release-cache.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: tjs-debian-${{ matrix.arch }}-${{ inputs.tjs_version }}-${{ env.TJS_CACHE_SCHEMA }}
        run: |
          install -m 755 /tmp/tjs-binary/tjs "/tmp/tjs-binary/${ASSET}"
          gh release upload "${TJS_CACHE_RELEASE}" "/tmp/tjs-binary/${ASSET}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view "${TJS_CACHE_RELEASE}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fxq "${ASSET}"

      - name: 准备 tjs 到 build context
        run: cp /tmp/tjs-binary/tjs ./tjs && chmod +x ./tjs

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Debian ${{ matrix.arch }} 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.debian
          target: runtime
          platforms: ${{ matrix.docker_platform }}
          push: ${{ inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}-debian-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-debian-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-debian-${{ matrix.arch }},mode=max

  # ────────────────────────────────────────────────────────────
  # 合并 Alpine manifest：将 amd64 + arm64 合并为单一多架构镜像
  # ────────────────────────────────────────────────────────────
  create-manifest-alpine:
    name: "合并 Alpine multi-arch manifest"
    runs-on: ubuntu-latest
    needs: build-alpine
    if: inputs.push && (inputs.variant == 'alpine' || inputs.variant == 'both')
    permissions:
      packages: write

    steps:
      - name: 确定标签
        id: ver
        run: |
          INPUT="${{ inputs.version }}"
          echo "tag=${INPUT:-latest}" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 合并并推送 Alpine manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="${{ steps.ver.outputs.tag }}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          echo "✅ ${IMAGE}:${TAG} (Alpine, amd64 + arm64, 均含 tjs)"

      - name: 验证 manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}"

  # ────────────────────────────────────────────────────────────
  # 合并 Debian manifest
  # ────────────────────────────────────────────────────────────
  create-manifest-debian:
    name: "合并 Debian multi-arch manifest"
    runs-on: ubuntu-latest
    needs: build-debian
    if: inputs.push && (inputs.variant == 'debian' || inputs.variant == 'both')
    permissions:
      packages: write

    steps:
      - name: 确定标签
        id: ver
        run: |
          INPUT="${{ inputs.version }}"
          echo "tag=${INPUT:-latest}" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 合并并推送 Debian manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="${{ steps.ver.outputs.tag }}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}-debian" \
            "${IMAGE}:${TAG}-debian-amd64" \
            "${IMAGE}:${TAG}-debian-arm64"
          echo "✅ ${IMAGE}:${TAG}-debian (Debian, amd64 + arm64, 均含 tjs)"

      - name: 验证 manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}-debian"
